name: Automated Postman API Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  # 1. 增加排程觸發 (UTC 時間 00:00，等於台灣時間早上 08:00)
  schedule:
    - cron: '0 0 * * *'
  # 允許在 GitHub 介面上手動點擊執行
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest

    # 允許 Actions 建立 Issue 的權限
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman and Reporters
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Run Postman Tests via Newman
        run: |
          mkdir -p newman
          newman run collection.json \
            -e environment.json \
            -r cli,htmlextra \
            --reporter-htmlextra-export newman/report.html

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-html-report
          path: newman/report.html

      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 [API 測試失敗] ${new Date().toISOString().split('T')[0]} 自動化巡檢未通過`,
              body: `### ⚠️ API 自動化測試報告異常\n\n- **觸發事件**: ${context.eventName}\n- **執行分支**: ${context.ref}\n- **Commit**: ${context.sha}\n\n請前往 [Actions 執行紀錄](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) 下載 HTML 測試報告進行排查！`
            })